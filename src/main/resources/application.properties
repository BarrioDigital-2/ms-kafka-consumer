spring.application.name=ms-kafka-consumer
server.port=8083

# ========== CONEXION A KAFKA ==========
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# --- Consumidor ---
spring.kafka.consumer.group-id=auditoria-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer: si un mensaje no se puede leer, se registra el error y se salta (no se queda en loop)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Ignorar el nombre de clase que manda el productor (es de otro microservicio) y usar nuestro DTO
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=cl.duoc.ms_kafka_consumer.dto.SolicitudEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.*

# --- Kafka Streams ---
spring.kafka.streams.application-id=dashboard-processor
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

# ========== LOGS ==========
logging.level.org.apache.kafka=WARN